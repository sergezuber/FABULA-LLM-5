name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The harness runs on every platform it claims to support, so a rule that holds on only one is a red
  # build rather than something someone discovers later on their own machine. macOS stays first because it
  # is where the product is developed; the other two are not "extra" — a failure on either is a failure.
  plugin-tests:
    name: Plugin tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform's failure must not hide another's
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install plugin dependencies
        working-directory: plugin
        # A package manager that could not DOWNLOAD one archive has told us nothing about this tree.
        # Measured on a runner: 2608 packages installed, one refused with "failed to download", and the
        # whole platform's row read as red. Retried — and still failing loudly when it genuinely cannot
        # be installed, because a swallowed install failure resurfaces later as something harder to read.
        shell: bash
        run: |
          for i in 1 2 3; do
            { bun install --frozen-lockfile || bun install; } && exit 0
            echo "install attempt $i did not succeed; retrying"
            sleep $((i * 10))
          done
          echo "dependencies could not be installed after three attempts"
          exit 1
      - name: Run tests
        working-directory: plugin
        # The bunfig preload in plugin/ is what makes these hermetic — run from there, never the repo root.
        run: bun test

  engine-tests:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install engine dependencies
        working-directory: engine
        # A package manager that could not DOWNLOAD one archive has told us nothing about this tree.
        # Measured on a runner: 2608 packages installed, one refused with "failed to download", and the
        # whole platform's row read as red. Retried — and still failing loudly when it genuinely cannot
        # be installed, because a swallowed install failure resurfaces later as something harder to read.
        shell: bash
        run: |
          for i in 1 2 3; do
            bun install && exit 0
            echo "install attempt $i did not succeed; retrying"
            sleep $((i * 10))
          done
          echo "dependencies could not be installed after three attempts"
          exit 1
      - name: Run engine tests
        working-directory: engine/packages/opencode
        # `bun run test`, not `bun test`: the package declares the per-test budget (--timeout 30000) and
        # calling the binary directly bypasses it. On a runner where spawning a process costs several times
        # what it costs here, ten checks were reported as failures for finishing later than a budget nobody
        # had told them about — a check that gives up sooner than the work it asked for is not a check.
        #
        # And the whole suite, not three directories of forty-five. The narrow list is why two failures in
        # test/file went unseen since the fork: a directory nothing runs is a directory nothing guards.
        run: bun run test test/

  adapter-tests:
    name: Adapter tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: What the suite needs, installed rather than assumed
        shell: bash
        # `setup-python` gives an interpreter and nothing else. The first run of this job failed on ALL
        # THREE platforms while the same suite was green locally — which is the shape that says the job is
        # wrong, not the code. jinja2 is here for the same reason it was discovered on Linux: without it
        # four context-audit tests report as failures rather than as a missing dependency.
        run: python -m pip install --quiet pytest jinja2
      - name: Run adapter tests
        working-directory: proxy
        shell: bash
        run: |
          python -m pytest --collect-only -q > collected.txt
          python -m pytest -q
      - name: The suite must have COLLECTED tests, not merely reported success
        working-directory: proxy
        shell: bash
        # `-q` once printed "110 passed" while five files contributed ZERO tests, so the count is
        # asserted rather than the word "passed": a suite that collected nothing must not read as green.
        run: |
          # pytest prints "N tests collected" as its last summary line; the per-test lines above it are
          # what a second -q would have suppressed, which is exactly how this check first read zero.
          n=$(grep -oE '[0-9]+ tests? collected' collected.txt | head -1 | grep -oE '[0-9]+' || true)
          echo "collected ${n:-0} test(s)"
          n=${n:-0}
          [ "$n" -ge 40 ] || { echo "::error::only $n tests collected — the suite is not running what it claims"; exit 1; }

  cross-build:
    name: Engine cross-build (Linux + Windows from macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install engine dependencies
        working-directory: engine
        # A package manager that could not DOWNLOAD one archive has told us nothing about this tree.
        # Measured on a runner: 2608 packages installed, one refused with "failed to download", and the
        # whole platform's row read as red. Retried — and still failing loudly when it genuinely cannot
        # be installed, because a swallowed install failure resurfaces later as something harder to read.
        shell: bash
        run: |
          for i in 1 2 3; do
            bun install && exit 0
            echo "install attempt $i did not succeed; retrying"
            sleep $((i * 10))
          done
          echo "dependencies could not be installed after three attempts"
          exit 1
      - name: Build the Linux and Windows engine binaries
        working-directory: engine/packages/opencode
        env:
          MIMOCODE_CHANNEL: prod
        run: bun run script/build.ts --only=linux-x64,windows-x64 --skip-embed-web-ui
      - name: Each artifact must be its own platform's format, not a renamed host binary
        working-directory: engine/packages/opencode
        run: |
          file dist/mimocode-linux-x64/bin/mimo       | grep -q "ELF 64-bit" || { echo "::error::linux artifact is not ELF"; exit 1; }
          file dist/mimocode-windows-x64/bin/mimo.exe | grep -q "PE32+"     || { echo "::error::windows artifact is not PE32+"; exit 1; }
          echo "cross-build verified"

  shell-linux:
    name: Desktop shell builds and bundles on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: WebKitGTK and friends
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Stamp the declared version into the shell manifests
        run: bun scripts/stamp-shell-version.ts
      - name: Build
        working-directory: shell
        # A REAL compile and link, not a check: the shell's non-macOS branches were cfg-gated code that had
        # never been built for their own platform, and the first attempt found a frontend path that only
        # resolved because the crate directory happened to be named `shell`.
        run: cargo build --release
      # Criterion 1 of the acceptance — "the application starts on a clean machine" — measured rather
      # than left to a human. A runner IS a clean machine: nothing of this project is installed on it.
      # The window is the claim, so the window is what is asserted: a real X server, the real shell
      # binary, and the window manager's own listing naming it. `--init` is not needed here (no docker),
      # but the engine must be built for THIS machine first, since the shell starts it.
      - name: The application starts on a clean machine, and its window exists
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb x11-utils
          # The engine's build script is a workspace package, so its dependencies have to be there —
          # this row installed the shell's, never the engine's, and the build died on a missing module.
          for i in 1 2 3; do
            (cd engine && bun install) && break
            echo "install attempt $i did not succeed; retrying"
            sleep $((i * 10))
            [ "$i" = 3 ] && { echo "dependencies could not be installed after three attempts"; exit 1; }
          done
          (cd engine/packages/opencode && bun run script/build.ts --only=linux-x64)
          mkdir -p bin
          cp engine/packages/opencode/dist/mimocode-linux-x64/bin/mimo bin/fabula
          chmod +x bin/fabula
          Xvfb :99 -screen 0 1280x860x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          sleep 3
          ./shell/target/release/fabula-shell >/tmp/shell.log 2>&1 &
          shell_pid=$!
          # Wait for the CONDITION — the window — not for a duration.
          # BOTH, for the same reason as the Windows twin: a window over an engine that has not answered
          # is not an application that started.
          engine_up=0
          for i in $(seq 1 200); do
            [ "$engine_up" = 0 ] && curl -sf -o /dev/null --max-time 3 http://127.0.0.1:4096/global/health && engine_up=1
            if xwininfo -root -tree 2>/dev/null | grep -qi "fabula" && [ "$engine_up" = 1 ]; then break; fi
            sleep 3
          done
          echo "── windows the server knows about ──"
          xwininfo -root -tree 2>/dev/null | grep -i "fabula" || true
          echo "── the engine answers ──"
          curl -s -o /dev/null -w "GET /global/health -> %{http_code}\n" http://127.0.0.1:4096/global/health || true
          echo "── shell log ──"
          tail -20 /tmp/shell.log || true
          xwininfo -root -tree 2>/dev/null | grep -qi "fabula" && [ "$engine_up" = 1 ] || {
            echo "::error::the application did not start on a clean machine (window? engine_up=$engine_up)"
            kill $shell_pid 2>/dev/null || true
            exit 1
          }
          kill $shell_pid 2>/dev/null || true

      - name: Bundle a .deb, and it must carry the version the source declares
        working-directory: shell
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles deb
          deb=$(find target -name '*.deb' | head -1)
          [ -n "$deb" ] || { echo "::error::no .deb produced"; exit 1; }
          v=$(sed -n 's/^export const FABULA_VERSION = "\(.*\)"$/\1/p' ../engine/packages/app/src/data/fabula-changelog.ts | head -1)
          dpkg-deb -I "$deb" | grep -q "Version: $v" || { echo "::error::the package does not carry $v"; exit 1; }
          echo "bundled $(basename "$deb") carrying $v"

  windows-installer-from-linux:
    name: Windows installer cross-built from Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: NSIS and the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis lld llvm clang
          cargo install cargo-xwin --locked
          cargo install tauri-cli --version "^2" --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Stamp the declared version into the shell manifests
        run: bun scripts/stamp-shell-version.ts
      - name: Build the installer, and prove the artifacts are Windows PE carrying the declared version
        working-directory: shell
        # A real installer, not a check: this is what proves the shell's Windows branches COMPILE AND LINK
        # on a machine that has no Windows. The version is asserted inside the PE resource, which stores
        # it as UTF-16 — an ASCII `strings` finds nothing there and would report a correct artifact as
        # broken, which is exactly what happened the first time this was measured by hand.
        run: |
          cargo tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis
          exe=$(find target -name 'fabula-shell.exe' | head -1)
          inst=$(find target -name '*-setup.exe' | head -1)
          [ -n "$exe" ] && [ -n "$inst" ] || { echo "::error::no Windows artifacts produced"; exit 1; }
          file "$exe"   | grep -q 'PE32+ executable' || { echo "::error::the app is not a Windows PE"; exit 1; }
          file "$inst"  | grep -q 'PE32'             || { echo "::error::the installer is not a Windows PE"; exit 1; }
          v=$(sed -n 's/^export const FABULA_VERSION = "\(.*\)"$/\1/p' ../engine/packages/app/src/data/fabula-changelog.ts | head -1)
          strings -a -el "$exe" | grep -qF "$v" || { echo "::error::the PE version resource does not carry $v"; exit 1; }
          echo "built $(basename "$inst") carrying $v"

  shell-windows:
    name: The application starts on a clean Windows machine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            (cd engine && bun install) && exit 0
            echo "install attempt $i did not succeed; retrying"
            sleep $((i * 10))
          done
          echo "dependencies could not be installed after three attempts"
          exit 1
      - name: setup.ps1 parses
        shell: pwsh
        run: |
          # This file has never been RUN on a Mac or a Linux box and cannot be: PowerShell is not there.
          # So the only place its grammar is ever checked is here. A setup script that does not parse
          # fails on the first machine a person clones onto, which is the worst place to find out.
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path setup.ps1), [ref]$null, [ref]$errs) | Out-Null
          if ($errs -and $errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host "::error file=setup.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            exit 1
          }
          Write-Host "setup.ps1 parses"
      - name: Stamp the declared version into the shell manifests
        run: bun scripts/stamp-shell-version.ts
      - name: Build the engine and the shell for THIS machine
        shell: bash
        run: |
          set -euo pipefail
          (cd engine/packages/opencode && bun run script/build.ts --only=windows-x64)
          mkdir -p bin
          cp engine/packages/opencode/dist/mimocode-windows-x64/bin/mimo.exe bin/fabula.exe
          (cd shell && cargo build --release)
        env:
          MIMOCODE_CHANNEL: prod
      # The claim is a WINDOW, so a window is what is asserted — and whether a runner can show one is a
      # question to MEASURE, not to declare impossible. This image ships the WebView2 runtime and the
      # runner holds a window station, so a GUI process can be started and asked for its main window.
      # If it turns out it cannot, this row says so in its own words rather than leaving a gap that reads
      # like coverage.
      - name: Start it and require a window
        shell: pwsh
        run: |
          $exe = "shell/target/release/fabula-shell.exe"
          if (-not (Test-Path $exe)) { Write-Output "::error::no shell executable at $exe"; exit 1 }
          # KEEP WHAT IT SAID. The first run measured a window and a silent engine, and had no way to
          # explain the second because the shell's own output went nowhere. A row that can see only half
          # of what it started can only report half of what happened.
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput shell-out.log -RedirectStandardError shell-err.log
          # Wait for the CONDITION — a main window — not for a duration.
          # WAIT FOR BOTH, and for the CONDITION rather than a stretch of time. The window alone is not the
          # application: the first measurement here found a window over an engine that had not answered yet,
          # because a first start on a clean machine performs a one-time database migration. The engine
          # arrived a little later and said so in its own log — which is exactly the case this row exists to
          # catch, and it would have passed on the window alone.
          $deadline = (Get-Date).AddSeconds(600)
          $engineUp = $false
          while ((Get-Date) -lt $deadline) {
            $p.Refresh()
            if ($p.HasExited) { break }
            if (-not $engineUp) {
              try { Invoke-WebRequest -Uri "http://127.0.0.1:4096/global/health" -TimeoutSec 3 -UseBasicParsing | Out-Null; $engineUp = $true } catch { }
            }
            if (($p.MainWindowHandle -ne 0) -and $engineUp) { break }
            Start-Sleep -Seconds 3
          }
          $p.Refresh()
          Write-Output "-- the process --"
          if ($p.HasExited) { Write-Output "it exited with $($p.ExitCode)" } else { Write-Output "still running, pid $($p.Id)" }
          Write-Output "main window handle: $($p.MainWindowHandle)"
          Write-Output "main window title : $($p.MainWindowTitle)"
          Write-Output "-- the engine --"
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:4096/global/health" -TimeoutSec 5 -UseBasicParsing
            Write-Output "GET /global/health -> $($r.StatusCode)"
          } catch { Write-Output "the engine did not answer: $($_.Exception.Message)" }
          Write-Output "-- what the shell said --"
          if (Test-Path shell-out.log) { Get-Content shell-out.log -Tail 30 } else { Write-Output "(it wrote nothing to output)" }
          if (Test-Path shell-err.log) { Get-Content shell-err.log -Tail 30 } else { Write-Output "(it wrote nothing to error)" }
          # AND WHAT THE ENGINE SAID. The shell starts it as a child and sends its output to a log of its
          # own, so the shell's streams are silent about the one thing that matters when the engine does
          # not answer. Searched rather than recomputed: reproducing the data-directory rule in a second
          # language is how two definitions of one rule start.
          Write-Output "-- what the engine said --"
          $logs = Get-ChildItem -Path $env:USERPROFILE -Filter plugins.log -Recurse -ErrorAction SilentlyContinue | Select-Object -First 3
          if ($logs) { foreach ($l in $logs) { Write-Output "   $($l.FullName)"; Get-Content $l.FullName -Tail 40 } }
          else { Write-Output "(no engine log was written at all — it never got as far as opening one)" }
          $ok = (-not $p.HasExited) -and ($p.MainWindowHandle -ne 0) -and $engineUp
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ok) {
            $why = if ($p.HasExited) { "the shell exited" } elseif ($p.MainWindowHandle -eq 0) { "no window appeared" } else { "the engine never answered" }
            Write-Output "::error::the application did not start on a clean Windows machine — $why"
            exit 1
          }

  deploy-guard-windows:
    name: Deploy guard runs where bash is optional
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # FIXTURE MATERIAL, not a dependency of the guard. The synthetic tree below needs one real
      # executable that also carries a version string, and this supplies it. The guard itself runs under
      # PowerShell alone — which is the whole claim being made here — and nothing in it calls bun.
      # It is installed explicitly because it is NOT already present: assuming it was made the fixture
      # fail to build and reported that as the guard being broken.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The PowerShell guard exists because on Windows the POSIX shell is a dependency the USER installs,
      # so the check deciding whether a deploy is real must not depend on it. Exercised against a synthetic
      # tree in both directions: all three artifacts correct must be FRESH and exit 0, and one artifact
      # carrying a foreign version must be STALE, exit 1, and NAME what that artifact actually carries.
      - name: Both verdicts, and the exit codes CI gates on
        shell: pwsh
        run: |
          $v = (Select-String -Path engine/packages/app/src/data/fabula-changelog.ts -Pattern '^export const FABULA_VERSION = "(.*)"$').Matches[0].Groups[1].Value
          $s = "$env:RUNNER_TEMP\synth"
          New-Item -ItemType Directory -Force -Path "$s/bin","$s/engine/packages/app/dist/assets","$s/engine/packages/opencode/src","$s/engine/packages/app/src/data","$s/dist" | Out-Null
          # A REAL executable that also CARRIES the version. The first attempt wrote a batch file named
          # .exe: Windows will not run that, so the guard's first check ("the binary runs") failed and the
          # whole verdict was STALE while all three version checks passed — a fixture defect reported as a
          # product defect. bun.exe is installed above, is a genuine PE, and answers --version;
          # appending our number leaves it valid (trailing bytes are ignored) and satisfies both checks.
          $bun = (Get-Command bun).Source
          Copy-Item $bun "$s/bin/fabula.exe"
          Add-Content -Path "$s/bin/fabula.exe" -Value """$v""" -Encoding Ascii
          "const v = `"$v`";" | Set-Content "$s/engine/packages/app/dist/assets/index-S.js"
          "export const FABULA_VERSION = `"$v`"" | Set-Content "$s/engine/packages/app/src/data/fabula-changelog.ts"
          $v | Set-Content "$s/dist/fabula.version"
          "export const x=1" | Set-Content "$s/engine/packages/opencode/src/a.ts"
          (Get-Item "$s/engine/packages/opencode/src/a.ts").LastWriteTime = (Get-Date).AddYears(-3)
          ./scripts/verify-deploy.ps1 $s
          if ($LASTEXITCODE -ne 0) { throw "a correct tree must be FRESH and exit 0" }
          "9.9.9" | Set-Content "$s/dist/fabula.version"
          $out = (./scripts/verify-deploy.ps1 $s | Out-String)
          if ($LASTEXITCODE -eq 0) { throw "a foreign version must be STALE and exit non-zero" }
          if ($out -notmatch "9\.9\.9") { throw "the report must NAME what the artifact actually carries" }
          Write-Host "both verdicts correct, and the mismatch is named"
          # The step's verdict is the ASSERTIONS, not the exit code of the last child. One of the two runs
          # is deliberately red — that is the half being proven — and its code lingers in $LASTEXITCODE,
          # which this shell returns as the step's own. Without this line the step failed while printing
          # that everything it checked was correct.
          exit 0

  acceptance-windows:
    name: Acceptance on real Windows (J3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies the acceptance itself checks
        shell: bash
        run: |
          python -m pip install --quiet pytest jinja2
          for i in 1 2 3; do
            { (cd plugin && { bun install --frozen-lockfile || bun install; }) && (cd engine && bun install); } && break
            echo "install attempt $i did not succeed; retrying"
            sleep $((i * 10))
            [ "$i" = 3 ] && { echo "dependencies could not be installed after three attempts"; exit 1; }
          done
      - name: Build the engine for THIS machine
        shell: bash
        env:
          MIMOCODE_CHANNEL: prod
        run: |
          (cd engine/packages/opencode && bun run script/build.ts --only=windows-x64)
          mkdir -p bin
          cp engine/packages/opencode/dist/mimocode-windows-x64/bin/mimo.exe bin/fabula.exe
          ./bin/fabula.exe --version
      - name: Run the acceptance matrix, and FAIL when it fails
        shell: bash
        # THE FIRST VERSION OF THIS STEP REPORTED SUCCESS OVER A FAILING ACCEPTANCE. It ran the script with
        # `|| true` so the output would always be visible, and then asserted only that three criteria were
        # not SKIPPED — and a criterion that FAILED satisfied that assertion. The job went green while the
        # acceptance said "4 pass, 2 fail". A gate that cannot go red is not a gate, and this one was
        # reporting on itself rather than on the product.
        #
        # Now: run ONCE, print everything, and let three separate conditions turn the job red —
        #   · the script's own exit code (any FAIL),
        #   · a SKIP of a criterion this machine can certainly run (4, 5, 8),
        #   · output that does not look like an acceptance report at all.
        # Criteria 1 and 2 stay MANUAL and are named as still-open rather than counted.
        run: |
          set -o pipefail
          # `set +e` around the capture, and it is load-bearing. The runner starts this shell with `-e`, under
          # which an assignment from a command substitution that exits non-zero KILLS THE SHELL AT THAT LINE —
          # before the echo, before every named criterion, before all three error annotations. MEASURED: a
          # three-minute run that printed NOTHING and failed with an exit code and no report. The previous
          # version of this step went GREEN over a failing acceptance; this one went RED over an invisible one.
          # Both are the gate reporting on ITSELF rather than on the product, and the second is worse, because
          # it cannot say what failed.
          set +e
          out=$(bun scripts/acceptance.ts 2>&1); rc=$?
          set -e
          echo "$out"
          grep -q "criteria:" <<<"$out" || { echo "::error::the acceptance produced no report"; exit 1; }
          for n in 4 5 8; do
            grep -qE "^\[( *ok *| FAIL )\] +$n\." <<<"$out" \
              || { echo "::error::criterion $n was skipped on a machine that can run it"; exit 1; }
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::the acceptance failed on this machine — see the named criteria above"
            exit 1
          fi

  swift-build:
    name: macOS app compiles
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the app bundle
        run: bash app/build.sh
